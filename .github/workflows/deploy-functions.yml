# Deploy the edge functions when they change.
#
# The repository lives on GitHub rather than on anybody's laptop, so a deploy that needs a local
# clone is a deploy that does not happen. This runs the CLI in Actions instead: push a change to
# supabase/functions and the account has it a minute later.
#
# supabase/config.toml pins verify_jwt = false for every function. That pin is the reason this
# workflow is safe to run: the CLI defaults it to true, and a deploy without the file would turn
# every endpoint into a 401 for the storefront that calls it.
#
# One secret is needed, once: SUPABASE_ACCESS_TOKEN, under Settings, Secrets and variables,
# Actions. Generate it at supabase.com/dashboard/account/tokens. Nothing else is stored here, and
# the Dengage credentials stay where they are, in the project's own environment.

name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  # So a deploy can be run by hand after setting the secret, without waiting for a change.
  workflow_dispatch:

concurrency:
  # A second push while the first is deploying would race two versions into the same slug.
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy every function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Add it under Settings, Secrets and variables,"
            echo "Actions, then re-run this workflow."
            exit 1
          fi
          supabase functions deploy --project-ref raextqlludkagdntyzwn

      - name: Prove every function still answers without a token
        run: |
          # The check that matters after a deploy: these endpoints are called from a browser with
          # no Supabase JWT, so a 401 here means verify_jwt came back on and the storefront is
          # down. Anything else, including 400 or 405, means the request reached the function.
          fail=0
          for f in supabase/functions/*/; do
            name=$(basename "$f")
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://raextqlludkagdntyzwn.supabase.co/functions/v1/$name")
            if [ "$code" = "401" ]; then
              echo "FAIL  $name answers 401: JWT verification is on"
              fail=1
            else
              echo "ok    $name answers $code"
            fi
          done
          exit $fail
